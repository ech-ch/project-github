# ==================================================
# Application Configuration
# ==================================================
spring.application.name=ECHStandards

# ==================================================
# Server Configuration
# ==================================================
# Server HTTP port (default: 8080)
server.port=8080

# Context path for the application (default: /)
# server.servlet.context-path=/

# ==================================================
# Thymeleaf Configuration
# ==================================================
# Disable template location check (not needed for REST APIs)
spring.thymeleaf.check-template-location=false

# ==================================================
# Logging Configuration
# ==================================================
# Logging level for the application
logging.level.root=INFO
logging.level.ch.zhaw.echstandards=INFO

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==================================================
# GitHub Configuration
# ==================================================
# Set to true to enable loading documents from GitHub
github.enabled=true

# GitHub repository details
# Example: totholi, mein-repo-name
github.owner=etemizab
github.repo=ech-schnittstellenstandard
github.branch=main

# Base path in the repository where the numbered folders are located
# Example: documents (for https://github.com/username/repo/tree/main/documents/1/content.txt)
# Leave empty if folders are at root level
github.base.path=

# File name for content files in each folder
github.content.filename=content.txt

# GitHub personal access token (optional, but recommended to avoid rate limits)
# Generate at: https://github.com/settings/tokens (needs 'repo' scope for private repos, or no scope for public)
github.token=${GITHUB_TOKEN:}
